<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мои денежки 💰</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root { --bg: #fdf6f3; --text: #3b2a2f; --muted: #8f7a80; --accent: #d9718c; }
@media (prefers-color-scheme: dark) { :root { --bg: #1d1719; --text: #f4e9ec; --muted: #b19ea4; --accent: #ec8fa7; } }
body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--text);
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
.box { max-width: 340px; }
.big { font-size: 44px; margin-bottom: 8px; }
h1 { font-size: 20px; margin: 0 0 8px; }
p { color: var(--muted); margin: 0 0 18px; }
a.btn { display: inline-block; background: var(--accent); color: #fff; text-decoration: none; padding: 12px 20px; border-radius: 12px; font-weight: 600; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); display: inline-block; margin: 0 3px; animation: b 1s infinite alternate; }
.dot:nth-child(2) { animation-delay: .2s } .dot:nth-child(3) { animation-delay: .4s }
@keyframes b { to { opacity: .2 } }
</style>
</head>
<body>
<div class="box" id="box">
  <div><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  <p style="margin-top:14px">Проверяю, что ты в клубе…</p>
</div>
<script>
(() => { // всё внутри функции, чтобы имена не мешали учёту после document.write
const API = "https://script.google.com/macros/s/AKfycbwkLTtZr7W8WBrmFXEyzqzxWQ-6DtVC7Q1V2lnihdNqNtmdeQ-BZ6x5qLVKoL6misFD/exec";
const BOT = "https://t.me/prodamusniksbot";
const tg = window.Telegram && window.Telegram.WebApp;
function show(icon, title, text, btn) {
  document.getElementById("box").innerHTML = `<div class="big">${icon}</div><h1>${title}</h1><p>${text}</p>` +
    (btn ? `<a class="btn" href="${BOT}">${btn}</a>` : "");
}
const MSG = {
  telegram: ["📱", "Открой «Мои денежки» в Телеграме", "Они работают только через бота клуба «Заказы круглый год»", "Открыть бота"],
  member: ["🌸", "«Мои денежки» только для участниц клуба", "Они доступны девочкам из клуба «Заказы круглый год». Чтобы вернуться в клуб, напиши боту", "Написать боту"],
  setup: ["🛠", "«Мои денежки» скоро заработают", "Татьяна заканчивает настройку — загляни чуть позже", ""],
  error: ["😔", "Не получилось открыть", "Проверь интернет и открой «Мои денежки» ещё раз", ""]
};
if (!tg || !tg.initData) show(...MSG.telegram);
else {
  tg.ready(); tg.expand();
  fetch(API, { method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify({ action: "uchetApp", initData: tg.initData }) })
    .then(r => r.json())
    .then(d => {
      if (d.ok && d.html) { document.open(); document.write(d.html); document.close(); }
      else { show(...(MSG[d.reason] || MSG.error)); if (d.detail) document.getElementById("box").insertAdjacentHTML("beforeend", `<p style="font-size:11px">${d.detail.replace(/</g, "&lt;")}</p>`); }
    })
    .catch(e => { show(...MSG.error); document.getElementById("box").insertAdjacentHTML("beforeend", `<p style="font-size:11px">${String(e).replace(/</g, "&lt;")}</p>`); });
}
})();
</script>
</body>
</html>
