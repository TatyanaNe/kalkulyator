<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Учёт продаж — тест</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root { --bg: #fdf6f3; --card: #ffffff; --text: #3b2a2f; --muted: #8f7a80; --line: #f0e1e3; --accent: #d9718c; --field: #fbf3f4; }
@media (prefers-color-scheme: dark) { :root { --bg: #1d1719; --card: #2a2124; --text: #f4e9ec; --muted: #b19ea4; --line: #3d3035; --accent: #ec8fa7; --field: #33282c; } }
body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--text);
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
.box { max-width: 340px; width: 100%; }
.big { font-size: 44px; margin-bottom: 8px; }
h1 { font-size: 20px; margin: 0 0 8px; }
p { color: var(--muted); margin: 0 0 18px; }
input { width: 100%; box-sizing: border-box; font: inherit; color: inherit; background: var(--field); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; text-align: center; }
input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
button { width: 100%; font: inherit; background: var(--accent); color: #fff; border: 0; padding: 12px 20px; border-radius: 12px; font-weight: 600; cursor: pointer; }
small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 12px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); display: inline-block; margin: 0 3px; animation: b 1s infinite alternate; }
.dot:nth-child(2) { animation-delay: .2s } .dot:nth-child(3) { animation-delay: .4s }
@keyframes b { to { opacity: .2 } }
</style>
</head>
<body>
<div class="box" id="box"></div>
<script>
(() => { // всё внутри функции, чтобы имена не мешали приложению после document.write
const API = "https://script.google.com/macros/s/AKfycbwkLTtZr7W8WBrmFXEyzqzxWQ-6DtVC7Q1V2lnihdNqNtmdeQ-BZ6x5qLVKoL6misFD/exec";
const APP = "uchet"; // kalk или uchet
const box = document.getElementById("box");
const get = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const put = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
let device = get("kt_device");
if (!device) { device = Date.now().toString(36) + Math.random().toString(36).slice(2, 10); put("kt_device", device); }

function show(icon, title, text) { box.innerHTML = `<div class="big">${icon}</div><h1>${title}</h1><p>${text}</p>`; }
function askName(again) {
  box.innerHTML = `<div class="big">🌸</div><h1>Привет! Как тебя зовут?</h1>
    <p>${again ? "Напиши имя, чтобы войти" : "Это тестовая версия приложений клуба «Заказы круглый год». Напиши своё имя — и заходи"}</p>
    <form id="f"><input id="n" maxlength="60" placeholder="Твоё имя" autocomplete="given-name" value="${esc(get("kt_name") || "")}"><button>Войти</button></form>
    <small>🔒 Твоё имя увидит Таня — так она знает, кто пробует приложения. Больше никто</small>`;
  document.getElementById("f").onsubmit = e => {
    e.preventDefault();
    const name = document.getElementById("n").value.trim();
    if (!name) { document.getElementById("n").focus(); return; }
    put("kt_name", name); enter(name);
  };
  document.getElementById("n").focus();
}
function enter(name) {
  box.innerHTML = `<div><span class="dot"></span><span class="dot"></span><span class="dot"></span></div><p style="margin-top:14px">Открываю…</p>`;
  fetch(API, { method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify({ action: "testApp", app: APP, name, device }) })
    .then(r => r.json())
    .then(d => {
      if (d.ok && d.html) { document.open(); document.write(d.html); document.close(); }
      else if (d.reason === "blocked") show("🌸", "Ой, ты не в клубе", "Таня ограничила тебе доступ. Если это ошибка — напиши ей");
      else if (d.reason === "name") askName(true);
      else if (d.reason === "setup") show("🛠", "Скоро заработает", "Таня заканчивает настройку — загляни чуть позже");
      else show("😔", "Не получилось открыть", "Проверь интернет и открой ссылку ещё раз");
    })
    .catch(() => show("😔", "Не получилось открыть", "Проверь интернет и открой ссылку ещё раз"));
}
const name = get("kt_name");
if (name) enter(name); else askName(false);
})();
</script>
</body>
</html>
